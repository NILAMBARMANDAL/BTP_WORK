# Render Blueprint for the Node/Express backend (the only service this repo
# deploys to Render — see ARCHITECTURE.md "Local ML hosting + tunnel" for why
# ml-service is NOT deployed here).
#
# Why not Render for ml-service: real, measured evidence (2026-09-12, this
# laptop) showed Render's free web-service tier (512MB RAM, 0.1 CPU) cannot
# run a Bengali-script-correct faster-whisper configuration at all —
# `tiny`/`base` (fit easily in 512MB) output romanized/Banglish text, not
# Bengali script; `small` (499MB measured RSS, right at the memory ceiling)
# outputs Devanagari-script transliteration, not Bengali script either; only
# `medium`+ produced genuinely correct Bengali script, and `medium` alone
# measured over 1GB RSS — categorically impossible on a 512MB instance. No
# paid Render plan was purchased or is required; instead, ml-service runs on
# the user's own laptop (GTX 1650, 4GB VRAM — already confirmed able to run
# the full `large-v3`/cuda/int8_float16 configuration for real, correct
# Bengali transcription) and is reached by this backend over a free
# Cloudflare Quick Tunnel. See `scripts/start-local-ml.ps1`.
#
# Deploy: Render dashboard -> New -> Blueprint -> select this repo. Render
# reads this file and creates the service below; you'll be prompted to fill
# in the `sync: false` env vars (secrets, or values that change whenever the
# laptop's tunnel restarts).
services:
  - type: web
    name: btp-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_MODE
        value: uri
      - key: MONGO_URI
        sync: false
      # The current Cloudflare Quick Tunnel URL printed by
      # scripts/start-local-ml.ps1 when it's running on the laptop, e.g.
      # https://some-random-words.trycloudflare.com — NOT stable: update this
      # in the Render dashboard every time the laptop/tunnel restarts (Quick
      # Tunnels get a new random hostname each run). See ARCHITECTURE.md.
      - key: ML_SERVICE_URL
        sync: false
      # Must exactly match ML_SERVICE_API_KEY in the laptop's
      # ml-service/.env — required once ml-service is reachable over the
      # public internet. Never put the real value in this file or in git.
      - key: ML_SERVICE_API_KEY
        sync: false
      # Generous: Whisper inference on a home GPU is fast, but the tunnel
      # adds latency and the laptop may be doing other things.
      - key: ML_SERVICE_TIMEOUT_MS
        value: "180000"
      - key: CORS_ORIGIN
        value: https://frontend-three-psi-tz8kxezc8c.vercel.app
      - key: MAX_AUDIO_UPLOAD_MB
        value: "25"

  # KNOWN LIMITATION, stated plainly: Render's free web-service disk is
  # ephemeral (wiped on redeploy/restart). AUDIO_STORAGE_DIR here is local
  # filesystem, matching current dev behavior — fine for a demo/prototype,
  # but per spec section 15/11 real production audio storage should move to
  # object storage (e.g. S3) before this is relied on for anything users
  # need to persist long-term. Not blocking for a working demo flow.
  #
  # ALSO WORTH KNOWING: Render's free web-service plan spins the SERVER
  # (this backend) down after 15 minutes of inactivity too, same as any free
  # tier — the first request after a spin-down will be slow (cold start)
  # before it even reaches the ML step. This is a Render free-tier property,
  # independent of the laptop ML arrangement above.
